<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드 대시보드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;
     background:linear-gradient(135deg,#1a1a2e,#16213e 60%,#0f3460);
     min-height:100vh;display:flex;align-items:center;justify-content:center}
.lock{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.15);border-radius:24px;
      padding:48px 40px;width:340px;text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,.4)}
.lock-icon{font-size:3rem;margin-bottom:16px}
.lock h1{color:#fff;font-size:1.2rem;font-weight:600;margin-bottom:6px}
.lock p{color:rgba(255,255,255,.5);font-size:.82rem;margin-bottom:28px}
input{width:100%;padding:14px 18px;border-radius:12px;
      border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
      color:#fff;font-size:1.1rem;letter-spacing:.15em;text-align:center;
      outline:none;margin-bottom:14px}
input:focus{border-color:#4f7ef8}
button{width:100%;padding:14px;border-radius:12px;border:none;background:#4f7ef8;
       color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
button:hover{background:#3a65d0}
.err{color:#ff6b6b;font-size:.82rem;margin-top:12px;min-height:18px}
</style></head><body>
<div class="lock" id="lock">
  <div class="lock-icon">🔒</div>
  <h1>카드 대시보드</h1>
  <p>비밀번호 입력</p>
  <input type="password" id="pw" autofocus>
  <button onclick="unlock()">열기</button>

</div>

const ITER = 200000;
async function unlock(){
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const blob = Uint8Array.from(atob(PAYLOAD), c=>c.charCodeAt(0));
    const salt = blob.slice(0, 16);
    const iv   = blob.slice(16, 28);
    const ct   = blob.slice(28);
    const enc  = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations: ITER, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch(e) {
    errEl.textContent = '❌ 비밀번호가 올바르지 않습니다';
    document.getElementById('pw').value = '';
  }
}
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});
